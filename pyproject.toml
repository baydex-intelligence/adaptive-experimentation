[tool.poetry]
name = "adaptive-experiments"
version = "0.1.0"
description = "A/B testing and multi-armed bandit simulation for learning and demonstration."
authors = []
readme = "README.md"
packages = [{ include = "adaptive_experiments", from = "src" }]

[tool.poetry.dependencies]
python = "3.13.12"
numpy = "^1.26"
scipy = "^1.12"
matplotlib = "^3.8"
pandas = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.4"
jupyter = "^1.1.1"
joblib = "^1.5.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
